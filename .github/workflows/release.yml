name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore pinned dependencies
        run: dotnet restore Tests/RandomStartMod.Tests.csproj --locked-mode
      - name: Validate assets
        run: python3 tools/validate_xml.py
      - name: Build and test
        run: dotnet test Tests/RandomStartMod.Tests.csproj -c Release --no-restore
      - name: Package release
        if: github.event_name == 'release'
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: python3 tools/package_mod.py --release-version "$RELEASE_VERSION" --output artifacts/RandomStart.zip
      - name: Attach release package
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_VERSION" artifacts/RandomStart.zip
      - name: Package manual development build
        if: github.event_name == 'workflow_dispatch'
        run: python3 tools/package_mod.py
      - uses: actions/upload-artifact@v4
        with:
          name: RandomStart-package
          path: artifacts/*.zip
          if-no-files-found: error
